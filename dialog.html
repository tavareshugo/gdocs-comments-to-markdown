<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <style>
      body {
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
        gap: 12px;
        height: 100vh;
        margin: 0;
        padding: 12px;
      }

      textarea {
        box-sizing: border-box;
        flex: 1;
        font-family: monospace;
        font-size: 13px;
        resize: none;
        width: 100%;
      }

      .actions {
        align-items: center;
        display: flex;
        gap: 8px;
      }

      #status {
        color: #188038;
      }
    </style>
  </head>
  <body>
    <textarea id="markdown" readonly aria-label="Markdown output"></textarea>
    <div class="actions">
      <button id="copy" type="button">Copy to clipboard</button>
      <button type="button" onclick="google.script.host.close()">Close</button>
      <span id="status" role="status"></span>
    </div>
    <script>
      var markdown = <?!= markdownJson ?>;
      var textarea = document.getElementById('markdown');
      var status = document.getElementById('status');
      textarea.value = markdown;

      document.getElementById('copy').addEventListener('click', function () {
        textarea.focus();
        textarea.select();
        var copyPromise = navigator.clipboard &&
          navigator.clipboard.writeText
          ? navigator.clipboard.writeText(markdown)
          : Promise.resolve(document.execCommand('copy'));

        copyPromise.then(function () {
          status.textContent = 'Copied';
          window.setTimeout(function () {
            status.textContent = '';
          }, 1500);
        }).catch(function () {
          if (document.execCommand('copy')) {
            status.textContent = 'Copied';
          }
        });
      });
    </script>
  </body>
</html>
